name: Fetch e-Stat municipal latest

on:
  schedule:
    # 毎月1日 12:00 JST (03:00 UTC) — 市区町村データは年次更新が主
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-estat
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Require ESTAT_APP_ID
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: |
          if [ -z "$ESTAT_APP_ID" ]; then
            echo "::error::Secret ESTAT_APP_ID が未設定です。https://www.e-stat.go.jp/api/ で発行し、リポジトリ Settings → Secrets に追加してください。"
            exit 1
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch crime-related municipal tables
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: python fetch_estat.py --profile crime-related --force

      - name: Commit processed latest only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p data/processed
          git add data/processed/municipal_latest.parquet data/processed/manifest.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update municipal_latest from e-Stat"

          for i in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push rejected; rebase try $i"
            git pull --rebase origin main
          done
          echo "::error::push failed after retries"
          exit 1
